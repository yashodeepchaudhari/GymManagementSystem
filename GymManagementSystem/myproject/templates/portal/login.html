{% extends 'portal/base.html' %}
{% block title %}Member Log In{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card main-card p-4">
      <div class="text-center mb-3">
        <i class="bi bi-person-circle" style="font-size: 3rem; color: #007bff;"></i>
        <h3 class="mt-2 mb-1">Welcome Back</h3>
        <p class="text-muted small">Log in to access your member dashboard</p>
      </div>

      <form method="POST" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username or Email</label>
          <input class="form-control" name="username" placeholder="e.g. john_doe or john@example.com" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" placeholder="Your password" required>
        </div>
        <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Log In</button>
      </form>

      <hr class="my-4">
      <div class="text-center">
        <p class="mb-2">Don't have an account? <a href="{% url 'member_signup' %}" class="fw-bold">Sign up here</a></p>
        <p class="mb-0 small">
          <a href="{% url 'home' %}" class="text-muted"><i class="bi bi-arrow-left"></i> Back to home</a>
          &nbsp;·&nbsp;
          <a href="{% url 'admin_login' %}" class="text-muted">Admin login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
