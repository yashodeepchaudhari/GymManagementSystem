<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Member Portal{% endblock %} | Gym</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <style>
    body { background: #f6f7fb; min-height: 100vh; }
    .navbar-brand { font-weight: 700; }
    .card-stat { border: none; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .stat-num { font-size: 2rem; font-weight: 700; }
    .stat-label { color: #888; font-size: 0.9rem; }
    .main-card { border-radius: 12px; border: none; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .pill-active { background: #d1fadf; color: #027a48; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; }
    .pill-expired { background: #fee4e2; color: #b42318; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'member_dashboard' %}"><i class="bi bi-activity"></i> GymPortal</a>
      {% if user.is_authenticated %}
      <div>
        <a class="text-white me-3" href="{% url 'member_dashboard' %}">Dashboard</a>
        <a class="text-white me-3" href="{% url 'member_profile' %}">Profile</a>
        <a class="text-white me-3" href="{% url 'home' %}">Site</a>
        <a class="btn btn-sm btn-outline-light" href="{% url 'member_logout' %}">Logout</a>
      </div>
      {% endif %}
    </div>
  </nav>

  <div class="container py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
