<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Trainer{% endblock %} | Gym</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <style>
    body { background: #f4f6fa; min-height: 100vh; font-family: 'Poppins', Arial, sans-serif; }
    .navbar-brand { font-weight: 700; }
    .main-card { border: none; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .pill-active { background: #d1fadf; color: #027a48; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; }
    .pill-expired { background: #fee4e2; color: #b42318; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark" style="background: #2c3e50;">
    <div class="container">
      <a class="navbar-brand" href="{% url 'trainer_dashboard' %}"><i class="bi bi-clipboard-check"></i> Trainer Portal</a>
      {% if user.is_authenticated %}
      <div>
        <span class="text-white me-3">Hi, {{ user.username }}</span>
        <a class="btn btn-sm btn-outline-light" href="{% url 'trainer_logout' %}">Logout</a>
      </div>
      {% endif %}
    </div>
  </nav>

  <div class="container py-4">
    {% if messages %}
      {% for m in messages %}
        <div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
