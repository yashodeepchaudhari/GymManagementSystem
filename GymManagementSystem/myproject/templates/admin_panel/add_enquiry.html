<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Enquiry</title>
  </head>
  <body>
    {% include "admin_panel/navbar.html" %}

    <div class="panel panel-narrow">
      <h2 class="text-center">Add Enquiry</h2>
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Name</label>{{ form.name }}</div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">Contact</label>{{ form.contact }}</div>
          <div class="col-md-6 mb-3"><label class="form-label">Email</label>{{ form.email }}</div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">Age</label>{{ form.age }}</div>
          <div class="col-md-6 mb-3"><label class="form-label">Gender</label>{{ form.gender }}</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Save Enquiry</button>
      </form>
    </div>
  </body>
</html>
