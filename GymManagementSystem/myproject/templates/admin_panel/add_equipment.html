<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Equipment</title>
  </head>
  <body>
    {% include "admin_panel/navbar.html" %}

    <div class="panel panel-narrow">
      <h2 class="text-center">Add Equipment</h2>
      <form method="POST" action="{% url 'add_equipment' %}">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Name</label>{{ form.name }}</div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label">Price (₹)</label>{{ form.price }}</div>
          <div class="col-md-6 mb-3"><label class="form-label">Unit</label>{{ form.unit }}</div>
        </div>
        <div class="mb-3"><label class="form-label">Date</label>{{ form.date }}</div>
        <div class="mb-3"><label class="form-label">Description</label>{{ form.description }}</div>
        <button type="submit" class="btn btn-primary w-100">Save Equipment</button>
      </form>
    </div>
  </body>
</html>
