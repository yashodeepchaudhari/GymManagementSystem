<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Plan</title>
  </head>
  <body>
    {% include "admin_panel/navbar.html" %}

    <div class="panel panel-narrow">
      <h2 class="text-center">Add Plan</h2>
      <form method="POST" action="{% url 'add_plan' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Name</label>
          {{ form.name }}
        </div>
        <div class="mb-3">
          <label class="form-label">Amount (₹)</label>
          {{ form.amount }}
        </div>
        <div class="mb-3">
          <label class="form-label">Duration Type</label>
          {{ form.duration }}
        </div>
        <div class="mb-3">
          <label class="form-label">Duration in Days</label>
          {{ form.duration_days }}
          <div class="form-text">Used to compute member expiry. e.g. 30 for monthly, 365 for yearly.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Save Plan</button>
      </form>
    </div>
  </body>
</html>
